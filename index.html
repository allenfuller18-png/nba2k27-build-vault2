/* User-selectable presentation mode. The choice is independent of saved builds. */
.view-switch{display:flex;align-items:center;gap:3px;padding:4px;background:#0e172a;border:1px solid #394762;border-radius:13px;flex-shrink:0}
.view-switch .view-opt{border:0;background:transparent;color:#9aabc6;border-radius:9px;padding:8px 11px;font-weight:800;font-size:12px;white-space:nowrap;cursor:pointer;min-height:36px}
.view-switch .view-opt[aria-pressed="true"]{background:linear-gradient(110deg,#7777f5,#9080fd);color:white;box-shadow:0 3px 12px #7777f533}
.view-switch .view-opt:hover:not([aria-pressed="true"]){background:#24314a;color:#e4edfa}
.view-help{font-size:10px;color:#9eafc9;max-width:140px;line-height:1.2}
/* Force a roomy desktop dashboard even on narrow screens; horizontal scrolling is intentional. */
body.layout-desktop{min-width:1040px}
body.layout-desktop .shell{width:min(1510px,100%);max-width:1510px;padding:26px 38px 80px}
body.layout-desktop .top{flex-wrap:nowrap;gap:24px}
body.layout-desktop .hero{grid-template-columns:1.4fr 1fr}
body.layout-desktop .hero-metrics{grid-template-columns:repeat(2,1fr)}
body.layout-desktop .cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:19px}
body.layout-desktop .build-card{padding:22px}
body.layout-desktop .attributes{grid-template-columns:repeat(2,minmax(0,1fr))}
body.layout-desktop .edit-grid,body.layout-desktop .edit-stat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
body.layout-desktop .mobile-nav{display:none}
body.layout-desktop .modal-wrap{padding:20px;align-items:center}
body.layout-desktop .modal{width:min(940px,95%);max-height:93dvh;border-radius:20px}
body.layout-desktop .modal-head,body.layout-desktop .modal-body,body.layout-desktop .modal-footer{padding:20px}
body.layout-desktop .lb-row{grid-template-columns:42px 1fr 90px 90px;gap:12px;padding:14px 18px}
body.layout-desktop .lb-name{font-size:13px}
body.layout-desktop .lb-score{font-size:15px}
body.layout-desktop .search{flex-basis:230px}
/* Force an intentionally narrow, touch-first layout even on a wide computer screen. */
body.layout-mobile .shell{max-width:510px;padding:16px 14px 112px}
body.layout-mobile .top{flex-wrap:wrap;gap:12px}
body.layout-mobile .top-actions{width:100%;gap:7px}
body.layout-mobile .hero{grid-template-columns:1fr}
body.layout-mobile .hero-main{padding:21px}
body.layout-mobile .hero h2{font-size:29px}
body.layout-mobile .hero-metrics{grid-template-columns:repeat(2,1fr)}
body.layout-mobile .metric{padding:13px 10px}
body.layout-mobile .metric strong{font-size:23px}
body.layout-mobile .cards{grid-template-columns:1fr}
body.layout-mobile .build-card{padding:17px}
body.layout-mobile .attributes{grid-template-columns:1fr}
body.layout-mobile .edit-grid,body.layout-mobile .edit-stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
body.layout-mobile .controls .search{flex-basis:100%}
body.layout-mobile .lb-row{grid-template-columns:25px minmax(0,1fr) 58px 58px;gap:5px;padding:13px 9px}
body.layout-mobile .lb-name{font-size:12px}
body.layout-mobile .lb-score{font-size:12px}
body.layout-mobile .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:15;background:#11182aee;backdrop-filter:blur(13px);border-top:1px solid #38445d;padding:9px 8px max(10px,env(safe-area-inset-bottom));justify-content:space-around}
body.layout-mobile .mobile-nav button{border:0;background:transparent;font-size:10px;color:#a7b5c9;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:57px}
body.layout-mobile .mobile-nav button span{font-size:20px}
body.layout-mobile .mobile-nav button.active{color:#b5a6ff}
body.layout-mobile .modal-wrap{padding:0;align-items:end}
body.layout-mobile .modal{max-height:96dvh;border-radius:22px 22px 0 0;width:min(510px,100%)}
body.layout-mobile .modal-head,body.layout-mobile .modal-body,body.layout-mobile .modal-footer{padding:14px}
@media(max-width:740px){
body.layout-desktop .hero h2{font-size:42px}
body.layout-desktop .hero-main{padding:28px}
body.layout-desktop .metric{padding:20px}
body.layout-desktop .metric strong{font-size:29px}
body.layout-desktop .tab{padding:11px 14px}
body.layout-desktop .search{flex-basis:230px}
body.layout-desktop .top-actions .btn{padding:10px 13px;font-size:13px}
body.layout-desktop .detail-shell{padding:22px}

 .build-card.goat{border-color:#36759a;background:linear-gradient(170deg,#142b45,#111a2b 75%)}.build-card.goat:before{background:linear-gradient(90deg,#72d5ff,transparent)}.tag.goat-tag{background:#174362;color:#9fe4ff}.goat-intro{border:1px solid #317394;background:linear-gradient(125deg,#113e57,#18233a);padding:20px;border-radius:var(--radius);margin-bottom:15px}.goat-intro h2{margin:0 0 5px;font-size:23px}.goat-intro p{margin:0;color:#c2d6e5;font-size:13px}

/* Dedicated scouting and build-analysis tab */

.analysis-intro h2{margin:6px 0;font-size:clamp(26px,4vw,36px);letter-spacing:-.04em}
.analysis-intro p{margin:7px 0 0;color:#b5c4dc;max-width:760px}
.analysis-layout{display:grid;grid-template-columns:minmax(205px,275px) minmax(0,1fr);gap:16px;align-items:start}
.analysis-sidebar,.analysis-report{background:#111a2b;border:1px solid #2f3c55;border-radius:17px;overflow:hidden}
.analysis-sidebar{position:sticky;top:14px}
.analysis-list-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px;border-bottom:1px solid #303b53}
.analysis-list-head span{font-size:11px;color:#91a1ba}
.analysis-choices{max-height:78vh;overflow:auto;padding:7px}

function analysisStrengthBar(stat,value,b){
 const c=capParts(b,stat),pct=n=>Math.max(0,Math.min(100,(n/99)*100));
 const tips=c.used||c.planned
  ? '<div class="analysis-attr-upgrades"><span>Base '+c.base+'</span>'+(c.used?'<span class="mint">+'+c.used+' applied</span>':'')+(c.planned?'<span class="gold">+'+c.planned+' planned</span>':'')+'</div>'
  : '';
 return `<div class="analysis-attr"><div class="analysis-attr-label"><span>${esc(stat)}</span><strong>${c.target}</strong></div><div class="analysis-track"><i class="analysis-base" style="width:${pct(c.base)}%"></i><i class="analysis-used" style="width:${pct(c.used)}%"></i><i class="analysis-planned" style="width:${pct(c.planned)}%"></i></div>${tips}</div>`;
}
function analysisBreakerCard(b,stat){
 const c=capParts(b,stat);
 const numbered=(arr,kind)=>arr.map((amt,i)=>`<span class="analysis-breaker-chip ${kind}">Breaker ${i+1}: +${amt}</span>`).join('');
 const appliedUnknown=c.usedUnknown>0?`<span class="analysis-breaker-unknown">+${c.usedUnknown} applied — individual breakdown unknown</span>`:'';
 const plannedUnknown=c.plannedUnknown>0?`<span class="analysis-breaker-unknown">+${c.plannedUnknown} planned — individual breakdown unknown</span>`:'';
 return `<div class="analysis-breaker-card">
 <div class="analysis-breaker-title"><strong>${esc(stat)}</strong><strong class="analysis-breaker-final">${c.target}</strong></div>
 <div class="analysis-track" aria-label="Base ${c.base}, applied ${c.used}, planned ${c.planned}"><i class="analysis-base" style="width:${c.base/99*100}%"></i><i class="analysis-used" style="width:${c.used/99*100}%"></i><i class="analysis-planned" style="width:${c.planned/99*100}%"></i></div>
 <div class="analysis-breaker-meta"><span>Base ${c.base}</span>${c.used?'<span class="mint">+'+c.used+' applied</span>':''}${c.planned?'<span class="gold">+'+c.planned+' planned</span>':''}</div>
 ${c.used?'<div class="analysis-breaker-label">Applied · '+c.usedSteps.length+' individually recorded</div><div class="analysis-breaker-chips">'+numbered(c.usedSteps,'applied')+appliedUnknown+'</div>':''}
 ${c.planned?'<div class="analysis-breaker-label">Planned · '+c.plannedSteps.length+' individually recorded</div><div class="analysis-breaker-chips">'+numbered(c.plannedSteps,'planned')+plannedUnknown+'</div>':''}
 </div>`;

 if(summary){const n=steps.reduce((a,b)=>a+(b?.length||0),0);summary.textContent=n+' individual amount'+(n===1?'':'s')+' recorded'}
 if(status)status.textContent=!validSteps?'Individual allocations must be positive numbers and not exceed their applied/planned totals.':steps.map((arr,i)=>{const missing=vals[i+1]-arr.reduce((a,n)=>a+n,0);return (i?'Planned':'Applied')+': '+arr.length+' recorded'+(missing?' · +'+missing+' not itemized':'')}).join(' | ');
 return validTotal&&validSteps;
}
function submitEdit(form){let d=new FormData(form),id=form.dataset.id,b=builds.find(x=>x.id===id);let name=String(d.get('name')||'').trim();if(!name){notify('Please give your build a name');return}let stats={},capBreakers={};for(let s of ALL_STATS){let vals=['base','used','planned'].map(k=>Number(d.get(k+':'+s)));if(!vals.every(n=>Number.isInteger(n)&&n>=0&&n<=99)||vals.reduce((a,b)=>a+b,0)>99){notify('Invalid upgrade for '+s+' (max 99)');return}let [base,used,planned]=vals;
const parse=type=>parseStepEntry(String(d.get(type+'Steps:'+s)||''));
const usedSteps=parse('used'),plannedSteps=parse('planned');
if(usedSteps===null||plannedSteps===null){notify('Use positive whole numbers separated by commas for '+s);return}
if(usedSteps.reduce((a,n)=>a+n,0)>used||plannedSteps.reduce((a,n)=>a+n,0)>planned){notify('Individual breaker amounts exceed their totals for '+s);return}
stats[s]=base+used+planned;
if(used||planned){capBreakers[s]={base,used,planned};if(usedSteps.length)capBreakers[s].usedSteps=usedSteps;if(plannedSteps.length)capBreakers[s].plannedSteps=plannedSteps}}let rec=nval(d.get('rec'),0),def=nval(d.get('def'),0);if(rec<0||rec>10||def<0||def>10){notify('REC and Def scores must be between 0 and 10');return}let value={id:b?.id||'build-'+Date.now().toString(36),name,pos:d.get('pos'),height:String(d.get('height')),weight:nval(d.get('weight')),wingspan:String(d.get('wingspan')),rec,def,speed:stats.Speed,capBreakers,legend:d.get('legend')!==null && d.get('goat')===null,goat:d.get('goat')!==null,legendName:String(d.get('legendName')||'').trim(),animations:d.get('animations')!==null,notes:String(d.get('notes')||''),stats};if(b){builds[builds.indexOf(b)]=value}else builds.push(value);save();closeEditor();currentId=value.id;render();notify(b?'Build updated ✓':'Build added ✓')}
function exportData(){let blob=new Blob([JSON.stringify({app:'My 2K27 Build Vault',schema:1,exportedAt:new Date().toISOString(),builds},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nba-2k27-build-vault-backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Backup exported')}
async function importData(file){if(!file)return;try{let data=JSON.parse(await file.text()),items=Array.isArray(data)?data:data.builds;if(!Array.isArray(items)||!items.length)throw Error('No build data found');let safe=items.map((x,i)=>{if(!x||typeof x.name!=='string'||typeof x.stats!=='object')throw Error('Invalid build at '+(i+1));let st=Object.fromEntries(ALL_STATS.map(s=>[s,Math.max(0,Math.min(99,Math.round(nval(x.stats[s],25))))]));return {id:String(x.id||'import-'+i),name:x.name,pos:String(x.pos||'C'),height:String(x.height||''),weight:nval(x.weight),wingspan:String(x.wingspan||''),rec:Math.max(0,Math.min(10,nval(x.rec))),def:Math.max(0,Math.min(10,nval(x.def))),speed:st.Speed,legend:!!x.legend&&!x.goat,goat:!!x.goat,legendName:String(x.legendName||''),animations:!!x.animations,notes:String(x.notes||''),stats:st,capBreakers:x.capBreakers&&typeof x.capBreakers==='object'&&!Array.isArray(x.capBreakers)?x.capBreakers:{}}});if(!confirm(`Replace the current ${builds.length} builds with ${safe.length} imported builds? Export a backup first if you want to keep your current edits.`))return;builds=migrateCapBreakers(safe);save();tab='all';currentId=null;render();notify('Backup imported successfully ✓')}catch(e){notify('Import failed: '+e.message)}}
document.addEventListener('click',e=>{let btn=e.target.closest('[data-action],[data-tab]');if(!btn)return;if(btn.dataset.tab){tab=btn.dataset.tab;currentId=null;query='';position='all';render();window.scrollTo({top:0,behavior:'smooth'});return}let a=btn.dataset.action,id=btn.dataset.id;if(a==='analysis-pick'){analysisId=id;render();return}if(a==='analysis-details'){currentId=id;render();window.scrollTo({top:0,behavior:'smooth'});return}if(a==='open-analysis'){analysisId=id;tab='analysis';currentId=null;render();window.scrollTo({top:0,behavior:'smooth'});return}if(a==='cb-add'||a==='cb-remove'){
 const row=btn.closest('[data-cap-row]'),kind=btn.dataset.kind;
 if(!row||!['used','planned'].includes(kind))return;
 const stepInput=row.querySelector('input[name^="'+kind+'Steps:"]'),totalInput=row.querySelector('input[name^="'+kind+':"]');
 const arr=parseStepEntry(stepInput?.value);
 if(!arr){notify('Correct the individual allocations before editing');return}
 let total=Number(totalInput.value);
 if(a==='cb-add'){
   const base=Number(row.querySelector('input[name^="base:"]')?.value);
   const other=Number(row.querySelector('input[name^="'+(kind==='used'?'planned':'used')+':"]')?.value);
   if(base+other+total>=99){notify('Attribute target cannot exceed 99');return}
   arr.push(1);totalInput.value=String(total+1);
 }else if(arr.length){
   const last=arr.pop();totalInput.value=String(Math.max(0,total-last));
 }
 stepInput.value=arr.join(', ');syncCapRow(row);return;
 }else if(a==='layout')setLayout(btn.dataset.mode);else if(a==='cloud')window.cloudVault?.openPanel();else if(a==='view'){currentId=id;render();window.scrollTo({top:0,behavior:'smooth'})}else if(a==='edit')editor(id);else if(a==='add')editor();else if(a==='close')closeEditor();else if(a==='back'){currentId=null;render()}else if(a==='export')exportData();else if(a==='import')document.getElementById('import-input').click();else if(a==='delete'){let b=builds.find(x=>x.id===id);if(b&&confirm(`Delete “${b.name}”? This cannot be undone unless you have an exported backup.`)){builds=builds.filter(x=>x.id!==id);save();closeEditor();currentId=null;render();notify('Build deleted')}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEditor();if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('lb-row')){e.preventDefault();currentId=e.target.dataset.id;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='edit-form'){e.preventDefault();submitEdit(e.target)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;render(true)}const row=e.target.closest('[data-cap-row]');if(row)syncCapRow(row)});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='position'){position=t.value;render()}else if(t.id==='sort'){sort=t.value;render()}else if(t.id==='bv-build-choice'){analysisId=t.value;render()}else if(t.id==='compare-a'){compareIds[0]=t.value;render()}else if(t.id==='compare-b'){compareIds[1]=t.value;render()}else if(t.id==='import-input'){importData(t.files[0]);t.value=''}});
render();
