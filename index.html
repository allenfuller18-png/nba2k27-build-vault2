function capInfo(b,s){
 const target=Math.round(Number(b.stats[s])||0),entry=b.capBreakers?.[s];
 if(!entry)return {base:target,used:0,planned:0,target};
 const base=Number(entry.base),used=Number(entry.used),planned=Number(entry.planned);
 if(![base,used,planned].every(n=>Number.isInteger(n)&&n>=0)||base+used+planned!==target)return {base:target,used:0,planned:0,target};
 return {base,used,planned,target};
}
function migrateCapBreakers(arr){
 return arr.map(original=>{
   const b=clone(original),seeds=CB_SEEDS[b.id]||{};
   // Rename the exact legacy build only; preserve all of its other fields.
   if(b.id==='b07' && b.name==='Mid-Post Rim Reaper')b.name='Shot-Axing 3-Level Dimer';
   if(!b.capBreakers||typeof b.capBreakers!=='object'||Array.isArray(b.capBreakers))b.capBreakers={};
   for(const [s,[base,used,planned]] of Object.entries(seeds)){
     if(!b.capBreakers[s]&&Number(b.stats?.[s])===base+used+planned)b.capBreakers[s]={base,used,planned};
   }
   return b;
 });
}

function render(preserveFocus=false){let active=preserveFocus?document.activeElement?.id:null,sel=null;if(active==='search'){let s=document.getElementById('search');sel=s?[s.selectionStart,s.selectionEnd]:null}let app=document.getElementById('app');app.innerHTML=header()+hero()+tabs()+(currentId?detail(currentId):tab==='rankings'?rankingsView():tab==='legends'?legendView():tab==='goats'?goatView():tab==='compare'?compareView():allView())+`<footer class="footer">Mobile / Desktop / Auto switch available above · Cloud sync available after setup and sign-in · Export JSON backups for safety · All ratings are editable personal assessments. Some imported attributes derive from older build snapshots and should be checked against the in-game builder.</footer>`+navigation();if(tab==='compare'&&!currentId){document.getElementById('compare-a').value=compareIds[0];document.getElementById('compare-b').value=compareIds[1]}if(active==='search'){let el=document.getElementById('search');el?.focus();if(sel)el.setSelectionRange(...sel)}}
function editor(id){let b=id?builds.find(x=>x.id===id):null,adding=!b;if(!b)b={id:'',name:'',pos:'C',height:"7'0\"",weight:230,wingspan:"7'3\"",rec:8,def:8,speed:60,legend:false,legendName:'',animations:false,notes:'',stats:Object.fromEntries(ALL_STATS.map(x=>[x,25]))};let f=(key,label,val,type='text',opts='')=>`<div class="field"><label for="f-${key}">${label}</label>${type==='select'?`<select id="f-${key}" name="${key}">${opts}</select>`:`<input id="f-${key}" name="${key}" type="${type}" value="${esc(val)}" ${type==='number'?'step="any"':''} required>`}</div>`;
let base=`<p class="helper cb-edit-help">Edit original ratings and cap-breaker bonuses below. Mint = applied, gold = planned. Target = base + applied + planned (max 99). These are attribute-rating increases, not token counts.</p><div class="edit-grid">${f('name','Build name',b.name)}${f('pos','Position',b.pos,'select',['PG','SG','SF','PF','C'].map(x=>`<option ${b.pos===x?'selected':''}>${x}</option>`).join(''))}${f('height','Height',b.height)}${f('weight','Weight (lbs)',b.weight,'number')}${f('wingspan','Wingspan',b.wingspan)}${f('rec','Overall REC rating /10',b.rec,'number')}${f('def','Defensive rating /10',b.def,'number')}</div><div class="editor-group"><label class="toggle"><input name="legend" id="f-legend" type="checkbox" ${b.legend?'checked':''}> Put this build in <strong>Based on Legends</strong></label><div class="field" style="margin-top:9px"><label for="f-legendName">Legend's name (optional)</label><input name="legendName" id="f-legendName" value="${esc(b.legendName)}" placeholder="e.g. Hakeem Olajuwon"></div></div><div class="editor-group"><label class="toggle"><input name="goat" type="checkbox" ${b.goat?'checked':''}> Official <strong>2K GOAT Build</strong> (not a custom legend)</label><p class="helper">Choose this for preset GOAT builds made by 2K. Leave it unchecked for builds you created yourself.</p></div><div class="editor-group"><label class="toggle"><input name="animations" type="checkbox" ${b.animations?'checked':''}> Scoring + playmaking animations completed</label></div>`;
let inputs=Object.entries(GROUPS).map(([name,ss])=>`<div class="editor-group"><h3>${esc(name)}</h3><div class="cb-edit-list">${ss.map(stat=>{let c=capInfo(b,stat);return `<div class="cb-edit-row" data-cap-row><strong>${esc(stat)}</strong><div class="cb-edit-fields"><label>Base<input type="number" min="0" max="99" step="1" name="base:${esc(stat)}" value="${c.base}" required></label><label class="cb-used-text">Applied +<input type="number" min="0" max="99" step="1" name="used:${esc(stat)}" value="${c.used}" required></label><label class="cb-planned-text">Planned +<input type="number" min="0" max="99" step="1" name="planned:${esc(stat)}" value="${c.planned}" required></label><div class="cb-result">Target <strong data-target>${c.target}</strong></div></div></div>`}).join('')}</div></div>`).join('');document.getElementById('modal-root').innerHTML=`<div class="modal-wrap" id="modal-wrap"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${adding?'Create a build':'Edit '+esc(b.name)}</h2><button type="button" class="btn ghost" data-action="close">✕ Close</button></div><form id="edit-form" data-id="${esc(b.id)}"><div class="modal-body">${base}${inputs}<div class="editor-group"><div class="field"><label for="f-notes">Notes, cap breakers and reminders</label><textarea id="f-notes" name="notes" rows="5" placeholder="Record breakers, animations, future plans…">${esc(b.notes)}</textarea></div></div></div><div class="modal-footer">${adding?'':`<button type="button" class="btn danger" data-action="delete" data-id="${esc(b.id)}">Delete</button>`}<span class="spacer"></span><button type="button" class="btn" data-action="close">Cancel</button><button type="submit" class="btn primary">Save build</button></div></form></section></div>`;document.querySelector('#edit-form input[name="name"]').focus()}
function closeEditor(){document.getElementById('modal-root').innerHTML=''}
function submitEdit(form){let d=new FormData(form),id=form.dataset.id,b=builds.find(x=>x.id===id);let name=String(d.get('name')||'').trim();if(!name){notify('Please give your build a name');return}let stats={},capBreakers={};for(let s of ALL_STATS){let vals=['base','used','planned'].map(k=>Number(d.get(k+':'+s)));if(!vals.every(n=>Number.isInteger(n)&&n>=0&&n<=99)||vals.reduce((a,b)=>a+b,0)>99){notify('Invalid upgrade for '+s+' (max 99)');return}let [base,used,planned]=vals;stats[s]=base+used+planned;if(used||planned)capBreakers[s]={base,used,planned}}let rec=nval(d.get('rec'),0),def=nval(d.get('def'),0);if(rec<0||rec>10||def<0||def>10){notify('REC and Def scores must be between 0 and 10');return}let value={id:b?.id||'build-'+Date.now().toString(36),name,pos:d.get('pos'),height:String(d.get('height')),weight:nval(d.get('weight')),wingspan:String(d.get('wingspan')),rec,def,speed:stats.Speed,capBreakers,legend:d.get('legend')!==null && d.get('goat')===null,goat:d.get('goat')!==null,legendName:String(d.get('legendName')||'').trim(),animations:d.get('animations')!==null,notes:String(d.get('notes')||''),stats};if(b){builds[builds.indexOf(b)]=value}else builds.push(value);save();closeEditor();currentId=value.id;render();notify(b?'Build updated ✓':'Build added ✓')}
function exportData(){let blob=new Blob([JSON.stringify({app:'My 2K27 Build Vault',schema:1,exportedAt:new Date().toISOString(),builds},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nba-2k27-build-vault-backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Backup exported')}
async function importData(file){if(!file)return;try{let data=JSON.parse(await file.text()),items=Array.isArray(data)?data:data.builds;if(!Array.isArray(items)||!items.length)throw Error('No build data found');let safe=items.map((x,i)=>{if(!x||typeof x.name!=='string'||typeof x.stats!=='object')throw Error('Invalid build at '+(i+1));let st=Object.fromEntries(ALL_STATS.map(s=>[s,Math.max(0,Math.min(99,Math.round(nval(x.stats[s],25))))]));return {id:String(x.id||'import-'+i),name:x.name,pos:String(x.pos||'C'),height:String(x.height||''),weight:nval(x.weight),wingspan:String(x.wingspan||''),rec:Math.max(0,Math.min(10,nval(x.rec))),def:Math.max(0,Math.min(10,nval(x.def))),speed:st.Speed,legend:!!x.legend&&!x.goat,goat:!!x.goat,legendName:String(x.legendName||''),animations:!!x.animations,notes:String(x.notes||''),stats:st,capBreakers:x.capBreakers&&typeof x.capBreakers==='object'&&!Array.isArray(x.capBreakers)?x.capBreakers:{}}});if(!confirm(`Replace the current ${builds.length} builds with ${safe.length} imported builds? Export a backup first if you want to keep your current edits.`))return;builds=migrateCapBreakers(safe);save();tab='all';currentId=null;render();notify('Backup imported successfully ✓')}catch(e){notify('Import failed: '+e.message)}}
document.addEventListener('click',e=>{let btn=e.target.closest('[data-action],[data-tab]');if(!btn)return;if(btn.dataset.tab){tab=btn.dataset.tab;currentId=null;query='';position='all';render();window.scrollTo({top:0,behavior:'smooth'});return}let a=btn.dataset.action,id=btn.dataset.id;if(a==='layout')setLayout(btn.dataset.mode);else if(a==='cloud')window.cloudVault?.openPanel();else if(a==='view'){currentId=id;render();window.scrollTo({top:0,behavior:'smooth'})}else if(a==='edit')editor(id);else if(a==='add')editor();else if(a==='close')closeEditor();else if(a==='back'){currentId=null;render()}else if(a==='export')exportData();else if(a==='import')document.getElementById('import-input').click();else if(a==='delete'){let b=builds.find(x=>x.id===id);if(b&&confirm(`Delete “${b.name}”? This cannot be undone unless you have an exported backup.`)){builds=builds.filter(x=>x.id!==id);save();closeEditor();currentId=null;render();notify('Build deleted')}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEditor();if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('lb-row')){e.preventDefault();currentId=e.target.dataset.id;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='edit-form'){e.preventDefault();submitEdit(e.target)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;render(true)}const row=e.target.closest('[data-cap-row]');if(row){let vals=['base','used','planned'].map(k=>Number(row.querySelector('input[name^="'+k+':"]')?.value));const out=row.querySelector('[data-target]'),sum=vals.reduce((a,b)=>a+b,0);if(out){out.textContent=vals.every(n=>Number.isInteger(n)&&n>=0)&&sum<=99?sum:'Invalid';out.classList.toggle('cb-invalid',sum>99)}}});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='position'){position=t.value;render()}else if(t.id==='sort'){sort=t.value;render()}else if(t.id==='compare-a'){compareIds[0]=t.value;render()}else if(t.id==='compare-b'){compareIds[1]=t.value;render()}else if(t.id==='import-input'){importData(t.files[0]);t.value=''}});
render();
</script>
<script src="./cloud.js"></script>
